# WaldOT Predictive Maintenance - Bootstrap Configuration

log.info("=== Predictive Maintenance System - Configuration Start ===")

# Create Compute Manager
compute = graph.addVertex("type", "compute", "label", "maintenance-compute", "Threads", "4")
log.info("Compute manager created")

# Motor 1 Sensors
vibrationMotor1 = graph.addVertex("type", "generator", "label", "vibration-motor-1", "Algorithm", "random", "Min", "0", "Max", "100", "Delay", "3000")
tempMotor1 = graph.addVertex("type", "generator", "label", "temp-motor-1", "Algorithm", "sinusoidal", "Min", "40", "Max", "90", "Delay", "5000")
currentMotor1 = graph.addVertex("type", "generator", "label", "current-motor-1", "Algorithm", "random", "Min", "10", "Max", "50", "Delay", "2000")
log.info("Motor 1 sensors created")

# Motor 2 Sensors
vibrationMotor2 = graph.addVertex("type", "generator", "label", "vibration-motor-2", "Algorithm", "random", "Min", "0", "Max", "100", "Delay", "3000")
tempMotor2 = graph.addVertex("type", "generator", "label", "temp-motor-2", "Algorithm", "sinusoidal", "Min", "40", "Max", "90", "Delay", "5000")
currentMotor2 = graph.addVertex("type", "generator", "label", "current-motor-2", "Algorithm", "random", "Min", "10", "Max", "50", "Delay", "2000")
log.info("Motor 2 sensors created")

# Motor 3 Sensors
vibrationMotor3 = graph.addVertex("type", "generator", "label", "vibration-motor-3", "Algorithm", "random", "Min", "0", "Max", "100", "Delay", "3000")
tempMotor3 = graph.addVertex("type", "generator", "label", "temp-motor-3", "Algorithm", "sinusoidal", "Min", "40", "Max", "90", "Delay", "5000")
currentMotor3 = graph.addVertex("type", "generator", "label", "current-motor-3", "Algorithm", "random", "Min", "10", "Max", "50", "Delay", "2000")
log.info("Motor 3 sensors created")

# Motor 4 Sensors
vibrationMotor4 = graph.addVertex("type", "generator", "label", "vibration-motor-4", "Algorithm", "random", "Min", "0", "Max", "100", "Delay", "3000")
tempMotor4 = graph.addVertex("type", "generator", "label", "temp-motor-4", "Algorithm", "sinusoidal", "Min", "40", "Max", "90", "Delay", "5000")
currentMotor4 = graph.addVertex("type", "generator", "label", "current-motor-4", "Algorithm", "random", "Min", "10", "Max", "50", "Delay", "2000")
log.info("Motor 4 sensors created")

log.info("Created 12 maintenance sensors total (4 motors x 3 sensors)")

# Create Predictive Maintenance Rules
vibrationWarningRule = graph.addVertex("type", "rule", "label", "vibration-warning", "Condition", "value > 70.0", "Action", "log.warn('High vibration detected: ' + value + ' mm/s')", "Priority", "100", "Hysteresis", "5000")
log.info("Vibration warning rule created")

tempCriticalRule = graph.addVertex("type", "rule", "label", "temperature-critical", "Condition", "value > 80.0", "Action", "log.error('Critical temperature: ' + value + '°C')", "Priority", "200", "Hysteresis", "5000")
log.info("Temperature critical rule created")

failurePredictionRule = graph.addVertex("type", "rule", "label", "failure-prediction", "Condition", "value > 85.0", "Action", "log.error('FAILURE PREDICTION: Critical indicator - ' + value)", "Priority", "500", "Hysteresis", "5000")
log.info("Failure prediction rule created")

log.info("Created 3 predictive maintenance rules")

# Connect Rules to Compute
vibrationWarningRule.addEdge("execute", compute, "Priority", "100")
tempCriticalRule.addEdge("execute", compute, "Priority", "200")
failurePredictionRule.addEdge("execute", compute, "Priority", "500")
log.info("Rules connected to compute")

# Connect Vibration Sensors to Vibration Warning Rule
vibrationMotor1.addEdge("fire", vibrationWarningRule, "monitor-property", "data", "active", "true")
vibrationMotor2.addEdge("fire", vibrationWarningRule, "monitor-property", "data", "active", "true")
vibrationMotor3.addEdge("fire", vibrationWarningRule, "monitor-property", "data", "active", "true")
vibrationMotor4.addEdge("fire", vibrationWarningRule, "monitor-property", "data", "active", "true")

# Connect Temperature Sensors to Temperature Critical Rule
tempMotor1.addEdge("fire", tempCriticalRule, "monitor-property", "data", "active", "true")
tempMotor2.addEdge("fire", tempCriticalRule, "monitor-property", "data", "active", "true")
tempMotor3.addEdge("fire", tempCriticalRule, "monitor-property", "data", "active", "true")
tempMotor4.addEdge("fire", tempCriticalRule, "monitor-property", "data", "active", "true")

# Connect Temperature Sensors to Failure Prediction Rule
tempMotor1.addEdge("fire", failurePredictionRule, "monitor-property", "data", "active", "true")
tempMotor2.addEdge("fire", failurePredictionRule, "monitor-property", "data", "active", "true")
tempMotor3.addEdge("fire", failurePredictionRule, "monitor-property", "data", "active", "true")
tempMotor4.addEdge("fire", failurePredictionRule, "monitor-property", "data", "active", "true")

log.info("Sensors connected to rules")

log.info("=== Predictive Maintenance - Configuration Complete ===")
log.info("OPC UA endpoint: opc.tcp://localhost:12690/waldot")
