# WaldOT Energy Monitoring - Bootstrap Configuration

log.info("=== Energy Monitoring System - Configuration Start ===")

# Create Compute Manager
compute = graph.addVertex("type", "compute", "label", "energy-compute", "Threads", "4")
log.info("Compute manager created")

# Office Building Sensors
powerOffice = graph.addVertex("type", "generator", "label", "power-office", "Algorithm", "sinusoidal", "Min", "10", "Max", "50", "Delay", "5000")
voltageOffice = graph.addVertex("type", "generator", "label", "voltage-office", "Algorithm", "random", "Min", "220", "Max", "240", "Delay", "5000")
currentOffice = graph.addVertex("type", "generator", "label", "current-office", "Algorithm", "random", "Min", "40", "Max", "230", "Delay", "5000")
log.info("Office building sensors created")

# Factory Building Sensors
powerFactory = graph.addVertex("type", "generator", "label", "power-factory", "Algorithm", "sinusoidal", "Min", "100", "Max", "500", "Delay", "5000")
voltageFactory = graph.addVertex("type", "generator", "label", "voltage-factory", "Algorithm", "random", "Min", "380", "Max", "420", "Delay", "5000")
currentFactory = graph.addVertex("type", "generator", "label", "current-factory", "Algorithm", "random", "Min", "240", "Max", "1320", "Delay", "5000")
log.info("Factory building sensors created")

# Warehouse Building Sensors
powerWarehouse = graph.addVertex("type", "generator", "label", "power-warehouse", "Algorithm", "sinusoidal", "Min", "20", "Max", "100", "Delay", "5000")
voltageWarehouse = graph.addVertex("type", "generator", "label", "voltage-warehouse", "Algorithm", "random", "Min", "220", "Max", "240", "Delay", "5000")
currentWarehouse = graph.addVertex("type", "generator", "label", "current-warehouse", "Algorithm", "random", "Min", "80", "Max", "455", "Delay", "5000")
log.info("Warehouse building sensors created")

log.info("Created 9 energy sensors total")

# Create Monitoring Rules
voltageAnomalyRule = graph.addVertex("type", "rule", "label", "voltage-anomaly", "Condition", "value < 210 || value > 250", "Action", "log.warn('Voltage anomaly: ' + value + 'V')", "Priority", "100", "Hysteresis", "5000")
log.info("Voltage anomaly rule created")

powerPeakRule = graph.addVertex("type", "rule", "label", "power-peak", "Condition", "value > 400", "Action", "log.warn('Power peak detected: ' + value + ' kW')", "Priority", "200", "Hysteresis", "5000")
log.info("Power peak rule created")

energyCostRule = graph.addVertex("type", "rule", "label", "energy-cost", "Condition", "value > 300", "Action", "log.info('High energy cost: ' + value + ' kW')", "Priority", "50", "Hysteresis", "60000")
log.info("Energy cost rule created")

log.info("Created 3 monitoring rules")

# Connect Rules to Compute
voltageAnomalyRule.addEdge("execute", compute, "Priority", "100")
powerPeakRule.addEdge("execute", compute, "Priority", "200")
energyCostRule.addEdge("execute", compute, "Priority", "50")
log.info("Rules connected to compute")

# Connect Voltage Sensors to Voltage Anomaly Rule
voltageOffice.addEdge("fire", voltageAnomalyRule, "monitor-property", "data", "active", "true")
voltageFactory.addEdge("fire", voltageAnomalyRule, "monitor-property", "data", "active", "true")
voltageWarehouse.addEdge("fire", voltageAnomalyRule, "monitor-property", "data", "active", "true")

# Connect Power Sensors to Power Peak Rule
powerOffice.addEdge("fire", powerPeakRule, "monitor-property", "data", "active", "true")
powerFactory.addEdge("fire", powerPeakRule, "monitor-property", "data", "active", "true")
powerWarehouse.addEdge("fire", powerPeakRule, "monitor-property", "data", "active", "true")

# Connect Power Sensors to Energy Cost Rule
powerOffice.addEdge("fire", energyCostRule, "monitor-property", "data", "active", "true")
powerFactory.addEdge("fire", energyCostRule, "monitor-property", "data", "active", "true")
powerWarehouse.addEdge("fire", energyCostRule, "monitor-property", "data", "active", "true")

log.info("Sensors connected to rules")

log.info("=== Energy Monitoring - Configuration Complete ===")
log.info("OPC UA endpoint: opc.tcp://localhost:12688/waldot")
