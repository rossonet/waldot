# WaldOT Industrial Monitoring System - Bootstrap Configuration
# Using simple graph API for maximum compatibility

log.info("=== Industrial Monitoring System - Configuration Start ===")

# Step 1: Create Compute Manager
log.info("Step 1: Creating compute manager...")

compute = graph.addVertex("type", "compute", "label", "main-compute", "Threads", "4")

log.info("  Compute manager created")

# Step 2: Create Sensors
log.info("Step 2: Creating sensors...")

# Office sensors
tempOffice = graph.addVertex("type", "generator", "label", "temp-office", "Algorithm", "sinusoidal", "Min", "18", "Max", "26", "Delay", "5000")
pressureOffice = graph.addVertex("type", "generator", "label", "pressure-office", "Algorithm", "random", "Min", "950", "Max", "1050", "Delay", "2000")

log.info("  Office sensors created")

# Warehouse sensors
tempWarehouse = graph.addVertex("type", "generator", "label", "temp-warehouse", "Algorithm", "random", "Min", "10", "Max", "35", "Delay", "5000")
pressureWarehouse = graph.addVertex("type", "generator", "label", "pressure-warehouse", "Algorithm", "random", "Min", "950", "Max", "1050", "Delay", "2000")

log.info("  Warehouse sensors created")

# Production sensors
tempProduction = graph.addVertex("type", "generator", "label", "temp-production", "Algorithm", "sinusoidal", "Min", "20", "Max", "40", "Delay", "5000")
pressureProduction = graph.addVertex("type", "generator", "label", "pressure-production", "Algorithm", "random", "Min", "950", "Max", "1050", "Delay", "2000")

log.info("  Production sensors created")
log.info("  Created 6 sensors total")

# Step 3: Create Rules
log.info("Step 3: Creating monitoring rules...")

# Temperature warning rule
tempWarningRule = graph.addVertex("type", "rule", "label", "temp-warning", "Condition", "temperature > 30.0", "Action", "log.warn('High temperature: ' + temperature)", "Priority", "100", "Hysteresis", "5000")

log.info("  Rule 'temp-warning' created")

# Temperature critical rule
tempCriticalRule = graph.addVertex("type", "rule", "label", "temp-critical", "Condition", "temperature > 35.0", "Action", "log.error('CRITICAL temperature: ' + temperature)", "Priority", "200", "Hysteresis", "5000")

log.info("  Rule 'temp-critical' created")

# Pressure warning rule
pressureWarningRule = graph.addVertex("type", "rule", "label", "pressure-warning", "Condition", "pressure < 970.0 || pressure > 1030.0", "Action", "log.warn('Pressure out of range: ' + pressure)", "Priority", "100", "Hysteresis", "5000")

log.info("  Rule 'pressure-warning' created")

log.info("  Created 3 monitoring rules")

# Step 4: Connect Rules to Compute
log.info("Step 4: Connecting rules to compute...")

tempWarningRule.addEdge("execute", compute, "Priority", "100")
tempCriticalRule.addEdge("execute", compute, "Priority", "200")
pressureWarningRule.addEdge("execute", compute, "Priority", "100")

log.info("  Rules connected to compute")

# Step 5: Connect Sensors to Rules
log.info("Step 5: Connecting sensors to rules...")

# Connect temperature sensors
tempOffice.addEdge("fire", tempWarningRule, "monitor-property", "data", "active", "true")
tempOffice.addEdge("fire", tempCriticalRule, "monitor-property", "data", "active", "true")

tempWarehouse.addEdge("fire", tempWarningRule, "monitor-property", "data", "active", "true")
tempWarehouse.addEdge("fire", tempCriticalRule, "monitor-property", "data", "active", "true")

tempProduction.addEdge("fire", tempWarningRule, "monitor-property", "data", "active", "true")
tempProduction.addEdge("fire", tempCriticalRule, "monitor-property", "data", "active", "true")

# Connect pressure sensors
pressureOffice.addEdge("fire", pressureWarningRule, "monitor-property", "data", "active", "true")
pressureWarehouse.addEdge("fire", pressureWarningRule, "monitor-property", "data", "active", "true")
pressureProduction.addEdge("fire", pressureWarningRule, "monitor-property", "data", "active", "true")

log.info("  Sensors connected to rules")

# Summary
log.info("=== Configuration Summary ===")
log.info("  Sensors: 6 (2 per zone)")
log.info("  Rules: 3")
log.info("  Zones: Office, Warehouse, Production")
log.info("")
log.info("=== Industrial Monitoring System - Configuration Complete ===")
log.info("OPC UA endpoint: opc.tcp://localhost:12686/waldot")
