# WaldOT Quality Control - Bootstrap Configuration

log.info("=== Quality Control System - Configuration Start ===")

# Create Compute Manager
compute = graph.addVertex("type", "compute", "label", "qc-compute", "Threads", "4")
log.info("Compute manager created")

# Create Quality Checkpoints
checkpoint1 = graph.addVertex("type", "generator", "label", "quality-checkpoint-1", "Algorithm", "random", "Min", "90", "Max", "100", "Delay", "10000")
checkpoint2 = graph.addVertex("type", "generator", "label", "quality-checkpoint-2", "Algorithm", "random", "Min", "90", "Max", "100", "Delay", "10000")
checkpoint3 = graph.addVertex("type", "generator", "label", "quality-checkpoint-3", "Algorithm", "random", "Min", "90", "Max", "100", "Delay", "10000")
checkpoint4 = graph.addVertex("type", "generator", "label", "quality-checkpoint-4", "Algorithm", "random", "Min", "90", "Max", "100", "Delay", "10000")
log.info("Quality checkpoints created")

# Create Defect Detector
defectDetector = graph.addVertex("type", "generator", "label", "defect-detector", "Algorithm", "random", "Min", "0", "Max", "5", "Delay", "15000")
log.info("Defect detector created")

log.info("Created 5 quality sensors total")

# Create Quality Control Rules
qualityGateRule = graph.addVertex("type", "rule", "label", "quality-gate", "Condition", "value < 95.0", "Action", "log.warn('Quality gate failed: ' + value + '%')", "Priority", "200", "Hysteresis", "5000")
log.info("Quality gate rule created")

defectAlertRule = graph.addVertex("type", "rule", "label", "defect-alert", "Condition", "value > 2.0", "Action", "log.error('High defect rate: ' + value + '%')", "Priority", "300", "Hysteresis", "5000")
log.info("Defect alert rule created")

quarantineRule = graph.addVertex("type", "rule", "label", "quarantine", "Condition", "value < 90.0", "Action", "log.error('QUARANTINE: Quality critical - ' + value + '%')", "Priority", "500", "Hysteresis", "5000")
log.info("Quarantine rule created")

log.info("Created 3 quality control rules")

# Connect Rules to Compute
qualityGateRule.addEdge("execute", compute, "Priority", "200")
defectAlertRule.addEdge("execute", compute, "Priority", "300")
quarantineRule.addEdge("execute", compute, "Priority", "500")
log.info("Rules connected to compute")

# Connect Quality Checkpoints to Quality Gate Rule
checkpoint1.addEdge("fire", qualityGateRule, "monitor-property", "data", "active", "true")
checkpoint2.addEdge("fire", qualityGateRule, "monitor-property", "data", "active", "true")
checkpoint3.addEdge("fire", qualityGateRule, "monitor-property", "data", "active", "true")
checkpoint4.addEdge("fire", qualityGateRule, "monitor-property", "data", "active", "true")

# Connect Quality Checkpoints to Quarantine Rule
checkpoint1.addEdge("fire", quarantineRule, "monitor-property", "data", "active", "true")
checkpoint2.addEdge("fire", quarantineRule, "monitor-property", "data", "active", "true")
checkpoint3.addEdge("fire", quarantineRule, "monitor-property", "data", "active", "true")
checkpoint4.addEdge("fire", quarantineRule, "monitor-property", "data", "active", "true")

# Connect Defect Detector to Defect Alert Rule
defectDetector.addEdge("fire", defectAlertRule, "monitor-property", "data", "active", "true")

log.info("Sensors connected to rules")

log.info("=== Quality Control - Configuration Complete ===")
log.info("OPC UA endpoint: opc.tcp://localhost:12689/waldot")
