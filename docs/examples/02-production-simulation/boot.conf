# WaldOT Production Simulation - Bootstrap Configuration

log.info("=== Production Simulation - Configuration Start ===")

# Create Compute Manager
compute = graph.addVertex("type", "compute", "label", "production-compute", "Threads", "4")
log.info("Compute manager created")

# Create Production Stations and Sensors
# Cutting Station
speedCutting = graph.addVertex("type", "generator", "label", "speed-cutting", "Algorithm", "incremental", "Min", "0", "Max", "100", "Delay", "1000")
qualityCutting = graph.addVertex("type", "generator", "label", "quality-cutting", "Algorithm", "random", "Min", "90", "Max", "100", "Delay", "5000")
log.info("Cutting station sensors created")

# Assembly Station
speedAssembly = graph.addVertex("type", "generator", "label", "speed-assembly", "Algorithm", "incremental", "Min", "0", "Max", "80", "Delay", "1000")
qualityAssembly = graph.addVertex("type", "generator", "label", "quality-assembly", "Algorithm", "random", "Min", "90", "Max", "100", "Delay", "5000")
log.info("Assembly station sensors created")

# Testing Station
speedTesting = graph.addVertex("type", "generator", "label", "speed-testing", "Algorithm", "incremental", "Min", "0", "Max", "60", "Delay", "1000")
qualityTesting = graph.addVertex("type", "generator", "label", "quality-testing", "Algorithm", "random", "Min", "90", "Max", "100", "Delay", "5000")
log.info("Testing station sensors created")

# Packaging Station
speedPackaging = graph.addVertex("type", "generator", "label", "speed-packaging", "Algorithm", "incremental", "Min", "0", "Max", "100", "Delay", "1000")
qualityPackaging = graph.addVertex("type", "generator", "label", "quality-packaging", "Algorithm", "random", "Min", "90", "Max", "100", "Delay", "5000")
log.info("Packaging station sensors created")

# Defect Detector
defectRate = graph.addVertex("type", "generator", "label", "defect-rate", "Algorithm", "random", "Min", "0", "Max", "10", "Delay", "10000")
log.info("Defect detector created")

log.info("Created 9 sensors total")

# Create Quality Control Rules
qualityCheckRule = graph.addVertex("type", "rule", "label", "quality-check", "Condition", "quality < 95.0", "Action", "log.warn('Quality below threshold: ' + quality)", "Priority", "100", "Hysteresis", "5000")
log.info("Quality check rule created")

defectAlarmRule = graph.addVertex("type", "rule", "label", "defect-alarm", "Condition", "defectRate > 5.0", "Action", "log.error('High defect rate: ' + defectRate)", "Priority", "200", "Hysteresis", "5000")
log.info("Defect alarm rule created")

lineStopRule = graph.addVertex("type", "rule", "label", "line-stop", "Condition", "quality < 90.0", "Action", "log.error('EMERGENCY: Line stop - Quality critical')", "Priority", "500", "Hysteresis", "5000")
log.info("Line stop rule created")

log.info("Created 3 rules")

# Connect Rules to Compute
qualityCheckRule.addEdge("execute", compute, "Priority", "100")
defectAlarmRule.addEdge("execute", compute, "Priority", "200")
lineStopRule.addEdge("execute", compute, "Priority", "500")
log.info("Rules connected to compute")

# Connect Quality Sensors to Rules
qualityCutting.addEdge("fire", qualityCheckRule, "monitor-property", "data", "active", "true")
qualityCutting.addEdge("fire", lineStopRule, "monitor-property", "data", "active", "true")
qualityAssembly.addEdge("fire", qualityCheckRule, "monitor-property", "data", "active", "true")
qualityAssembly.addEdge("fire", lineStopRule, "monitor-property", "data", "active", "true")
qualityTesting.addEdge("fire", qualityCheckRule, "monitor-property", "data", "active", "true")
qualityTesting.addEdge("fire", lineStopRule, "monitor-property", "data", "active", "true")
qualityPackaging.addEdge("fire", qualityCheckRule, "monitor-property", "data", "active", "true")
qualityPackaging.addEdge("fire", lineStopRule, "monitor-property", "data", "active", "true")

# Connect Defect Sensor to Rule
defectRate.addEdge("fire", defectAlarmRule, "monitor-property", "data", "active", "true")

log.info("Sensors connected to rules")

log.info("=== Production Simulation - Configuration Complete ===")
log.info("OPC UA endpoint: opc.tcp://localhost:12687/waldot")
