site_name: WaldOT Documentation
site_description: Complete documentation for WaldOT - Digital Twin Engine bridging OPC UA and Apache TinkerPop
site_author: Zona Autonoma srl
site_url: https://github.com/rossonet/waldot

markdown_extensions:
  - toc:
      baselevel: "1"
      toc_depth: "5"
      permalink: true
  - admonition
  - codehilite:
      guess_lang: false
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.details
  - pymdownx.emoji

theme:
  name: material
  scheme: slate
  logo: immagini/rossonet-logo-03_centered.png
  favicon: immagini/icon.ico
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate
  palette:
    primary: custom
  font:
    text: 20px Comfortaa,cursive

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - offline
  - with-pdf:
      author: andrea.ambrosini@rossonet.com
      toc_title: Table of Contents / Indice dei contenuti
      copyright: Zona Autonoma srl
      cover: true
      back_cover: false
      cover_title: WaldOT - Digital Twin Engine Documentation
      cover_subtitle: Complete Guide for Users, Developers, and Architects - Version 0.6.2
      cover_logo: immagini/rossonet-logo-02.png
      verbose: true

nav:
  - Home: README.md

  - Architecture:
      - Architecture Overview: ARCHITECTURE_OVERVIEW.md

  - Users & Operators:
      - User Guide: USER_GUIDE.md
      - Configuration Reference: CONFIGURATION.md
      - Examples:
          - Overview: examples/README.md
          - 1. Plain vertices: examples/01-plain-vertices.md
          - 2. Active edges: examples/02-active-edges.md
          - 3. Generators and rules: examples/03-generators-and-rules.md
          - 4. Complete bootstrap: examples/04-bootstrap.md
          - 5. Showcase Dungeon Arena: examples/05-showcase-arena.md
          - 6. Showcase Evolution Lab: examples/06-showcase-evolution.md
          - 7. Showcase Gas Grid: examples/07-showcase-gas-grid.md

  - Developers:
      - Developer Guide: DEVELOPER_GUIDE.md
      - Integration Guide (Plugins): INTEGRATION_GUIDE.md

  - Modules & Plugins:
      - waldot-api: https://github.com/rossonet/waldot/tree/master/waldot-api
      - waldot-namespace: https://github.com/rossonet/waldot/tree/master/waldot-namespace
      - Bootstrap Configuration: https://github.com/rossonet/waldot/blob/master/waldot-namespace/BOOTSTRAP_CONFIGURATION.md
      - waldot-runner: https://github.com/rossonet/waldot/tree/master/waldot-runner
      - waldot-app: https://github.com/rossonet/waldot/tree/master/waldot-app
      - Generator Plugin: https://github.com/rossonet/waldot/tree/master/plugins/waldot-plugin-generator
      - Rules Engine Plugin: https://github.com/rossonet/waldot/tree/master/plugins/waldot-plugin-rules-engine
      - TinkerPop Server Plugin: https://github.com/rossonet/waldot/tree/master/plugins/waldot-plugin-tinkerpop

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rossonet/waldot
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/rossonet/waldot
  version:
    provider: mike
