// Build root di WaldOT (solo i progetti in waldot/, vedi settings.gradle).
// Nel build combinato wot-addons questo file NON viene valutato: le opzioni comuni
// stanno in gradle/conventions.gradle, applicato da entrambi i build.
plugins {
	id 'java'
	id 'eclipse'
	id 'org.jreleaser' version '1.21.0' apply false
}

description = "WaldOT - TinkerPop implementation with Milo OpcUA"
group = 'net.rossonet.waldot'
version = '0.6.2'

ext {
	debianName = "${project.name}"
	packageName = "${project.name}"
}

repositories {
	mavenCentral()
	maven { url 'https://jitpack.io' }
}

// Convenzioni comuni (Java, Eclipse, test, Javadoc, clean, JNA, git.properties):
// file condiviso con il build combinato wot-addons (../build.gradle).
apply from: 'gradle/conventions.gradle'
