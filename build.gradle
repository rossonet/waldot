plugins {
        id 'java'
        id 'eclipse'
        id 'org.jreleaser' version '1.21.0' apply false
}

description = "WaldOT - TinkerPop implementation with Milo OpcUA"
group = 'net.rossonet.waldot'
version = '0.6.2'

ext {
    sourceCompatibility = JavaVersion.VERSION_26
    targetCompatibility = JavaVersion.VERSION_26
    debianName = "${project.name}"
    packageName = "${project.name}"
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

task eclipseClosedDependencies {}

task eclipseClosedDependencies_ {}

eclipse {
    classpath {
        downloadJavadoc = true
        downloadSources = true
    }
}

// Configure gitProperties plugin centrally so subprojects that don't contain
// a .git directory (because their source is in a subfolder) won't fail the build.
subprojects {
        afterEvaluate { proj ->
                if (proj.plugins.hasPlugin('com.gorylenko.gradle-git-properties')) {
                        proj.gitProperties {
                                dotGitDirectory = rootProject.layout.projectDirectory.dir('.git')
                                failOnNoGitDirectory = false
                        }
                }
        }
}

task view { doLast { println "Working on project ${project.name} [ ${project.description} ]" } }
