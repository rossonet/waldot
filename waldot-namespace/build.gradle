plugins {
    id "org.jreleaser"
    id "com.gorylenko.gradle-git-properties" version "2.5.7"
}

description = "WaldOT OpcUA namespace"
group = 'net.rossonet.waldot'
version = "${rootProject.version}"

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url "https://oss.sonatype.org/content/repositories/releases/" }
}

apply plugin: 'java'
apply plugin: 'java-library'
apply plugin: 'eclipse'
apply plugin: 'jacoco'
apply plugin: 'distribution'
apply plugin: 'signing'
apply plugin: 'maven-publish'
// org.jreleaser applied via plugins DSL above

dependencies {
    api project(':waldot-api')
    implementation project(':waldot-deps')
    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'org.apache.commons:commons-lang3:3.20.0'
//    annotationProcessor group: 'org.apache.tinkerpop', name: 'gremlin-annotations', version: '3.8.2'
    testImplementation project(':waldot-client')
    testImplementation testFixtures(project(':waldot-client'))
    testImplementation group: 'com.ginsberg', name: 'junit5-system-exit', version: '2.0.2'
    testImplementation group: 'org.apache.tinkerpop', name: 'gremlin-test', version: '3.8.2'
    testImplementation group: 'com.google.inject', name: 'guice', version: '7.0.0'
    testImplementation(platform('org.junit:junit-bom:5.13.1'))
	testImplementation('org.junit.jupiter:junit-jupiter')
	testImplementation('org.slf4j:slf4j-simple:2.0.17')
	testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

task eclipseClosedDependencies {}

task eclipseClosedDependencies_ {}

compileJava {
    options.encoding = "UTF-8"
    options.compilerArgs.addAll(['-XprintProcessorInfo'])
}

eclipse {
    classpath {
        downloadJavadoc = true
        downloadSources = true
    }
}

task view { doLast { println "Working on project ${project.name} [ ${project.description} ]" } }

jar {
    enabled = true
}

jar.doLast { task ->
    // archivePath deprecated/removed; use archiveFile
    ant.checksum file: task.archiveFile.get().asFile
}

java {
    withJavadocJar()
    withSourcesJar()
}

test {
    useJUnitPlatform()
    // La suite completa (server Milo embedded) supera l'heap di default -> OOM nel test executor
    maxHeapSize = "2g"
    // Gryo (Kryo FieldSerializer) needs reflective access to the JDK classes
    // it registers (e.g. AtomicLong): same options as the Dockerfile/waldot-app
    jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
            '--add-opens=java.base/java.util=ALL-UNNAMED',
            '--add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

// Pragmatic threshold: keeps quality pressure high while allowing complex integration tests.
jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.28
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.12
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

javadoc{
    destinationDir = file("${project.buildDir}/docs/javadoc/${project.name}/")
    failOnError=false
}

publishing {
  publications {
    mavenJava(MavenPublication){
      artifactId = "${project.name}"
      from components.java
      versionMapping {
        usage('java-api') {
          fromResolutionOf('runtimeClasspath')
        }
        usage('java-runtime') {
          fromResolutionResult()
        }
      }
      pom {
        name = "${project.name}"
        description = "${project.description}"
        url = 'https://www.rossonet.net/'
        licenses {
          license {
            name = 'Apache-2.0 license'
            url = 'https://www.apache.org/licenses/LICENSE-2.0'
          }
        }
        developers {
          developer {
            id = 'ar4k'
            name = 'Andrea Ambrosini'
            email = 'andrea.ambrosini@rossonet.com'
          }
        }
        scm {
          connection = 'scm:git:git://github.com/rossonet/waldot.git'
          developerConnection = 'scm:git:ssh://github.com:rossonet/waldot.git'
          url = 'https://github.com/rossonet/waldot/tree/master'
        }
      }
    }
  }
  repositories {
    maven {
      name = 'staging'
      url  = layout.buildDirectory.dir('staging-deploy')
    }
  }
}

if (plugins.hasPlugin('org.jreleaser')) {
  jreleaser {
    signing {
      active = 'ALWAYS'
      armored = true
      secretKey = System.getenv('GPG_PRIVATE')
      publicKey = System.getenv('GPG_PUBLIC')
    }
    deploy {
      maven {
        mavenCentral {
          sonatype {
            active = 'ALWAYS'
            url = 'https://central.sonatype.com/api/v1/publisher'
            stagingRepository(
                layout.buildDirectory
                       .dir('staging-deploy')
                       .get()
                       .asFile
                       .absolutePath
            )
            username = System.getenv('OSSRH_USERNAME')
            password = System.getenv('OSSRH_PASSWORD') 
          }
        }
      }
    }
  }
}

if (plugins.hasPlugin('org.jreleaser')) {
  tasks.named('publish').configure { dependsOn 'jreleaserDeploy' }
  tasks.named('jreleaserDeploy').configure { dependsOn 'publishAllPublicationsToStagingRepository' }
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}