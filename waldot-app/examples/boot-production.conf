// WaldOT production bootstrap example (script mode: JEXL syntax, '//' comments,
// variables, statements terminated by ';')
// Mounted on /waldot/boot.conf by docker-compose-production.yml.
// Replace this content with the graph of your installation.

// A simulated sensor: a sim:generator vertex publishes a new value in its
// 'data' property every 'delay' milliseconds.
sensor = graph.addVertex('id', 'temp-sensor-1', 'type', 'sim:generator', 'label', 'temp-sensor-1',
    'directory', 'plant/sensors',
    'algorithm', 'sinusoidal', 'min', '18', 'max', '26', 'delay', '5000');

// A plain vertex used as a data holder (no behavior, just properties)
room = graph.addVertex('id', 'control-room', 'label', 'control-room', 'directory', 'plant/areas',
    'temperature', '0');

// Active edge: every change of sensor.data is copied into room.temperature
sensor.addEdge('feeds', room, 'type', 'link-to', 'properties-to-monitor', 'data', 'data', 'temperature');

// Rules engine: a compute vertex runs the rules connected with rules:execute edges
compute = graph.addVertex('id', 'main-compute', 'type', 'rules:compute', 'label', 'main-compute',
    'directory', 'plant/rules', 'threads', '2');
alarm = graph.addVertex('id', 'temp-alarm', 'type', 'rules:rule', 'label', 'temp-alarm',
    'directory', 'plant/rules',
    'condition', "g.V().has('id','control-room').next().property('temperature').value().toString().toDouble() > 25.0",
    'action', "log.warn('High temperature in control room')",
    'hysteresis', '10000');
compute.addEdge('runner', alarm, 'type', 'rules:execute', 'priority', '100');

// fire edge: the rule is queued every time room.temperature changes
room.addEdge('watch', alarm, 'type', 'fire', 'properties-to-monitor', 'temperature');

log.info('production bootstrap completed');
