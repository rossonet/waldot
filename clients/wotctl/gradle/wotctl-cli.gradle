// Executable of wotctl: fat jar, installDist/distZip with the completion script,
// native binary (GraalVM) and its archive. Applied by wotctl and by the
// distributions that add plugins to it (e.g. wot-addons/wotctl-addons/wotctl-acme):
// the commands of the plugins on the runtime classpath are found with
// ServiceLoader, also by the completion script and by native-image.
//
// The module applies the plugins java, application, com.gradleup.shadow and
// org.graalvm.buildtools.native, and sets, before 'apply from':
//   ext.cliName            name of the executable and of the completion script
//   ext.cliMainClass       main class (net.rossonet.waldot.cli.WaldotCli)
//   ext.cliJarName         name of the fat jar
//   ext.nativeMetadataDir  see wotctl-native.gradle
//   ext.nativeDistName     (optional) prefix of the archive of the native binary, default cliName
// A source set 'nativeSmokeTest', if present, is run on the binary by the task
// nativeSmokeTest.

apply from: new File(buildscript.sourceFile.parentFile, 'wotctl-native.gradle')

configurations {
    // commons-logging (from waldot-deps) replaced by its slf4j bridge (from
    // wotctl): the logs go to stderr with the others, and native-image does not
    // look for the log4j 1.x classes of org.apache.commons.logging.impl.Log4JLogger
    configureEach {
        exclude group: 'commons-logging', module: 'commons-logging'
    }
}

def cliName = project.ext.cliName
def cliMainClass = project.ext.cliMainClass
def nativeDistName = project.ext.has('nativeDistName') ? project.ext.nativeDistName : cliName

// bash/zsh completion script, generated by picocli from the commands
def completionScript = tasks.register('completionScript', JavaExec) {
    description = "Generates the bash/zsh completion script of ${cliName}."
    group = 'build'
    def output = layout.buildDirectory.file("completion/${cliName}_completion")
    classpath = sourceSets.main.runtimeClasspath
    mainClass = cliMainClass
    args 'completion'
    outputs.file(output)
    doFirst {
        standardOutput = new FileOutputStream(output.get().asFile.tap { parentFile.mkdirs() })
    }
}

application {
    mainClass = cliMainClass
    applicationName = cliName
}

distributions {
    main {
        contents {
            from(completionScript) {
                into 'completion'
            }
        }
    }
}

jar {
    manifest {
        attributes 'Main-Class': cliMainClass,
                   'Implementation-Title': cliName,
                   'Implementation-Version': project.version
    }
    enabled = true
}

// executable fat jar: java -jar build/libs/<cliJarName>
shadowJar {
    archiveFileName = project.ext.cliJarName
    // also the META-INF/services of the plugins
    mergeServiceFiles()
    // the signatures of the signed dependencies (e.g. BouncyCastle) are not
    // valid in the fat jar
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/*.EC'
    manifest {
        attributes 'Main-Class': cliMainClass,
                   'Implementation-Title': cliName,
                   'Implementation-Version': project.version,
                   'Multi-Release': 'true'
    }
    doLast { println("fat jar of ${project.name}: ${archiveFile.get().asFile}") }
}

// --- native binary (GraalVM) --------------------------------------------------
// GraalVM 25.0.2 or later (the metadata repository needs its schema), e.g.:
// GRAALVM_HOME=~/.local/jvm/graalvm-jdk-25.0.4+7.1 ./gradlew :<module>:nativeCompile
graalvmNative {
    binaries {
        main {
            imageName = cliName
            mainClass = cliMainClass
            // an executable: with the plugin java-library (wotctl, API of the
            // plugins) the default would be a shared library
            sharedLibrary = false
            buildArgs.addAll(
                '--no-fallback',
                '-H:+ReportExceptionStackTraces',
                // runs on any x86-64/aarch64 CPU, not only on the build machine
                '-march=compatibility',
                // fewer threads: less memory used by the builder
                '--parallelism=4',
                // the static initializers of the NodeIds* classes of Milo
                // (thousands of NodeId constants) make the points-to analysis
                // run out of memory (more than 10 GB of heap): initialized at
                // build time they are data in the image heap, not code
                '--initialize-at-build-time=' + [
                    'org.eclipse.milo.opcua.stack.core.NodeIds',
                    'org.eclipse.milo.opcua.stack.core.NodeIds0',
                    'org.eclipse.milo.opcua.stack.core.NodeIds1',
                    'org.eclipse.milo.opcua.stack.core.NodeIds2',
                    'org.eclipse.milo.opcua.stack.core.NodeIds3',
                    'org.eclipse.milo.opcua.stack.core.NodeIds4',
                    'org.eclipse.milo.opcua.stack.core.NodeIds5',
                    // immutable values of the constants (NodeId, ByteString, ...)
                    'org.eclipse.milo.opcua.stack.core.types.builtin'
                ].join(',')
            )
            // fully static executable (musl, only linux-amd64): -PnativeStatic=true;
            // needs the musl toolchain (x86_64-linux-musl-gcc and zlib) in the
            // PATH, see docker/Dockerfile.build-wotctl
            if (project.findProperty('nativeStatic') == 'true') {
                buildArgs.addAll('--static', '--libc=musl')
            }
            // heap of the builder: -PnativeImageXmx=... to change it
            jvmArgs.add("-Xmx${project.findProperty('nativeImageXmx') ?: '6g'}")
        }
    }
}

def nativeBinary = layout.buildDirectory.file("native/nativeCompile/${cliName}")

if (sourceSets.findByName('nativeSmokeTest') != null) {
    tasks.register('nativeSmokeTest', Test) {
        description = 'Runs the smoke tests on the native binary (requires GraalVM, see nativeCompile).'
        group = 'verification'
        testClassesDirs = sourceSets.nativeSmokeTest.output.classesDirs
        classpath = sourceSets.nativeSmokeTest.runtimeClasspath
        useJUnitPlatform()
        // -PwotctlBinary=/path/wotctl tests a binary built elsewhere (e.g. by
        // docker/Dockerfile.build-wotctl), without GraalVM
        def binary = project.hasProperty('wotctlBinary')
                ? file(project.property('wotctlBinary'))
                : nativeBinary.get().asFile
        if (!project.hasProperty('wotctlBinary')) {
            dependsOn tasks.named('nativeCompile')
        }
        inputs.file(binary)
        systemProperty 'wotctl.binary', binary.absolutePath
        systemProperty 'wotctl.version', project.version.toString()
        // optional WaldOT server for the tests with a connection
        if (System.getenv('WOTCTL_SMOKE_ENDPOINT') != null) {
            environment 'WOTCTL_SMOKE_ENDPOINT', System.getenv('WOTCTL_SMOKE_ENDPOINT')
        }
        testLogging {
            events 'passed', 'skipped', 'failed'
        }
    }
}

// <nativeDistName>-<version>-<os>-<arch>.tar.gz with the binary and the completion script
tasks.register('nativeDist', Tar) {
    description = 'Packages the native binary and the completion script.'
    group = 'distribution'
    def os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    def osName = os.contains('linux') ? 'linux' : (os.contains('mac') ? 'macos' : (os.contains('win') ? 'windows' : os))
    def arch = System.getProperty('os.arch')
    def archName = arch in ['amd64', 'x86_64'] ? 'x86_64' : (arch in ['aarch64', 'arm64'] ? 'aarch64' : arch)
    archiveFileName = "${nativeDistName}-${project.version}-${osName}-${archName}.tar.gz"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    compression = Compression.GZIP
    into("${nativeDistName}-${project.version}") {
        from(tasks.named('nativeCompile')) {
            include cliName
            include "${cliName}.exe"
            into 'bin'
            filePermissions { unix('rwxr-xr-x') }
        }
        from(completionScript) {
            into 'completion'
        }
        // only if the module has one
        from('LICENSE')
    }
}
