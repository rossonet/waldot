# Configurazione di slf4j-simple per la CLI wotctl.
# Tutti i log vanno su stderr: stdout è riservato ai dati.
# Il livello predefinito (warn) si alza con -v (info), -vv (debug), -vvv (trace)
# o con la variabile WALDOT_LOG_LEVEL; le proprietà di sistema impostate dalla
# CLI prevalgono su questo file.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.logFile=System.err
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss.SSS
org.slf4j.simpleLogger.log.io.netty=warn
