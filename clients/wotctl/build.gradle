plugins {
    id "com.gradleup.shadow" version "9.3.2"
    id "com.gorylenko.gradle-git-properties" version "2.5.7"
    // native binary (GraalVM native-image): only the native* tasks need GraalVM
    id "org.graalvm.buildtools.native"
}

description = "WaldOT command line interface (wotctl)"
group = 'net.rossonet.waldot'
version = "${rootProject.version}"

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'jacoco'
apply plugin: 'application'

ext {
    cliName = "wotctl"
    cliMainClass = "net.rossonet.waldot.cli.WaldotCli"
    cliJarName = "wotctl.jar"
    // reflection, resources and proxies of the native image (tracing agent + manual entries)
    nativeMetadataDir = "src/main/resources/META-INF/native-image/net.rossonet.waldot/wotctl"
}

sourceSets {
    // tests of the native binary, run only by the task nativeSmokeTest
    nativeSmokeTest {
        java.srcDir 'src/nativeSmokeTest/java'
    }
}

configurations {
    // commons-logging (from waldot-deps) replaced by its slf4j bridge: the
    // logs go to stderr with the others, and native-image does not look for
    // the log4j 1.x classes of org.apache.commons.logging.impl.Log4JLogger
    configureEach {
        exclude group: 'commons-logging', module: 'commons-logging'
    }
    nativeSmokeTestImplementation.extendsFrom testImplementation
    nativeSmokeTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    // only the client: no dependency on waldot-namespace (Eclipse build path
    // cycle, waldot-namespace uses wotctl in its integration tests)
    implementation project(':waldot-client')
    // TinkerPop structure (vertices, edges) of the query results
    implementation project(':waldot-deps')
    implementation group: 'info.picocli', name: 'picocli', version: '4.7.7'
    implementation 'org.slf4j:slf4j-api:2.0.17'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'
    runtimeOnly 'org.slf4j:jcl-over-slf4j:2.0.17'

    testImplementation(platform('org.junit:junit-bom:5.13.1'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testImplementation('org.mockito:mockito-core:5.18.0')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

task eclipseClosedDependencies {}

task eclipseClosedDependencies_ {}

compileJava {
    options.encoding = "UTF-8"
}

eclipse {
    classpath {
        downloadJavadoc = true
        downloadSources = true
    }
}

task view { doLast { println "Working on project ${project.name} [ ${project.description} ]" } }

// version of wotctl as a resource: the native binary has no manifest
def generateVersionResource = tasks.register('generateVersionResource') {
    def output = layout.buildDirectory.file('generated/version/wotctl-version.properties')
    def cliVersion = project.version.toString()
    inputs.property('version', cliVersion)
    outputs.file(output)
    doLast {
        output.get().asFile.text = "version=${cliVersion}\n"
    }
}

processResources {
    from(generateVersionResource) {
        into 'net/rossonet/waldot/cli'
    }
}

// bash/zsh completion script, generated by picocli from the commands
def completionScript = tasks.register('completionScript', JavaExec) {
    description = 'Generates the bash/zsh completion script of wotctl.'
    group = 'build'
    def output = layout.buildDirectory.file("completion/${cliName}_completion")
    classpath = sourceSets.main.runtimeClasspath
    mainClass = cliMainClass
    args 'completion'
    outputs.file(output)
    doFirst {
        standardOutput = new FileOutputStream(output.get().asFile.tap { parentFile.mkdirs() })
    }
}

application {
    mainClass = cliMainClass
    applicationName = cliName
}

distributions {
    main {
        contents {
            from(completionScript) {
                into 'completion'
            }
        }
    }
}

jar {
    manifest {
        attributes 'Main-Class': cliMainClass,
                   'Implementation-Title': cliName,
                   'Implementation-Version': project.version
    }
    enabled = true
}

// executable fat jar: java -jar build/libs/wotctl.jar
shadowJar {
    archiveFileName = cliJarName
    mergeServiceFiles()
    // the signatures of the signed dependencies (e.g. BouncyCastle) are not
    // valid in the fat jar
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/*.EC'
    manifest {
        attributes 'Main-Class': cliMainClass,
                   'Implementation-Title': cliName,
                   'Implementation-Version': project.version,
                   'Multi-Release': 'true'
    }
    doLast { println("fat jar of ${project.name}: ${archiveFile.get().asFile}") }
}

gitProperties {
    failOnNoGitDirectory = false
    dateFormat = "yyyy-MM-dd HH:mm:ssZ"
    dateFormatTimeZone = 'GMT'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
    // the tracing agent of native-image (-Pagent) exists only in GraalVM
    if (project.hasProperty('agent') && System.getenv('GRAALVM_HOME') != null) {
        executable = "${System.getenv('GRAALVM_HOME')}/bin/java"
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// --- native binary (GraalVM) --------------------------------------------------
// GraalVM 25.0.2 or later (the metadata repository needs its schema), e.g.:
// GRAALVM_HOME=~/.local/jvm/graalvm-jdk-25.0.4+7.1 ./gradlew :wotctl:nativeCompile
// The metadata are collected with the tracing agent on the unit tests:
//   ./gradlew :wotctl:test -Pagent && ./gradlew :wotctl:nativeMetadata
graalvmNative {
    // native-image from GRAALVM_HOME (or JAVA_HOME): the normal build and the
    // tests do not need GraalVM
    toolchainDetection = false
    metadataRepository {
        enabled = true
    }
    binaries {
        main {
            imageName = cliName
            mainClass = cliMainClass
            buildArgs.addAll(
                '--no-fallback',
                '-H:+ReportExceptionStackTraces',
                // runs on any x86-64/aarch64 CPU, not only on the build machine
                '-march=compatibility',
                // fewer threads: less memory used by the builder
                '--parallelism=4',
                // the static initializers of the NodeIds* classes of Milo
                // (thousands of NodeId constants) make the points-to analysis
                // run out of memory (more than 10 GB of heap): initialized at
                // build time they are data in the image heap, not code
                '--initialize-at-build-time=' + [
                    'org.eclipse.milo.opcua.stack.core.NodeIds',
                    'org.eclipse.milo.opcua.stack.core.NodeIds0',
                    'org.eclipse.milo.opcua.stack.core.NodeIds1',
                    'org.eclipse.milo.opcua.stack.core.NodeIds2',
                    'org.eclipse.milo.opcua.stack.core.NodeIds3',
                    'org.eclipse.milo.opcua.stack.core.NodeIds4',
                    'org.eclipse.milo.opcua.stack.core.NodeIds5',
                    // immutable values of the constants (NodeId, ByteString, ...)
                    'org.eclipse.milo.opcua.stack.core.types.builtin'
                ].join(',')
            )
            // fully static executable (musl, only linux-amd64): -PnativeStatic=true;
            // needs the musl toolchain (x86_64-linux-musl-gcc and zlib) in the
            // PATH, see docker/Dockerfile.build-wotctl
            if (project.findProperty('nativeStatic') == 'true') {
                buildArgs.addAll('--static', '--libc=musl')
            }
            // heap of the builder: -PnativeImageXmx=... to change it
            jvmArgs.add("-Xmx${project.findProperty('nativeImageXmx') ?: '6g'}")
        }
    }
    agent {
        defaultMode = 'standard'
    }
}

// Copies the metadata collected by the tracing agent on the unit tests
// (./gradlew :wotctl:test -Pagent) without the entries of the tests (JUnit,
// Mockito, ByteBuddy, test classes): ./gradlew :wotctl:nativeMetadata
tasks.register('nativeMetadata') {
    description = 'Copies the native-image metadata of the tracing agent, without the test entries.'
    group = 'native'
    def input = layout.buildDirectory.file('native/agent-output/test/reachability-metadata.json')
    def output = file("${nativeMetadataDir}/reachability-metadata.json")
    inputs.file(input)
    outputs.file(output)
    doLast {
        // the entries are matched as JSON text
        def testOnly = ~/org[.\/]mockito|net[.\/]bytebuddy|org[.\/]junit|org[.\/]opentest4j|org[.\/]apiguardian|mockito-extensions|junit-platform|MockitoMock|net\.rossonet\.waldot\.cli\.([a-z]+\.)?([A-Za-z]+Test|CliTestSupport|MockClient|CommandTestBase)[$"]/
        def keep = { entry -> !(groovy.json.JsonOutput.toJson(entry) =~ testOnly) }
        def key = { entry -> groovy.json.JsonOutput.toJson(entry.type ?: entry.glob ?: entry.bundle ?: entry) }
        def metadata = new groovy.json.JsonSlurper().parse(input.get().asFile)
        def filtered = [:]
        metadata.each { section, entries ->
            filtered[section] = entries instanceof List ? entries.findAll(keep).sort(key) : entries
        }
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(filtered)) + '\n'
        filtered.each { section, entries ->
            println "${section}: ${metadata[section].size()} -> ${entries.size()} entries"
        }
    }
}

def nativeBinary = layout.buildDirectory.file("native/nativeCompile/${cliName}")

tasks.register('nativeSmokeTest', Test) {
    description = 'Runs the smoke tests on the native binary (requires GraalVM, see nativeCompile).'
    group = 'verification'
    testClassesDirs = sourceSets.nativeSmokeTest.output.classesDirs
    classpath = sourceSets.nativeSmokeTest.runtimeClasspath
    useJUnitPlatform()
    // -PwotctlBinary=/path/wotctl tests a binary built elsewhere (e.g. by
    // docker/Dockerfile.build-wotctl), without GraalVM
    def binary = project.hasProperty('wotctlBinary')
            ? file(project.property('wotctlBinary'))
            : nativeBinary.get().asFile
    if (!project.hasProperty('wotctlBinary')) {
        dependsOn tasks.named('nativeCompile')
    }
    inputs.file(binary)
    systemProperty 'wotctl.binary', binary.absolutePath
    systemProperty 'wotctl.version', project.version.toString()
    // optional WaldOT server for the tests with a connection
    if (System.getenv('WOTCTL_SMOKE_ENDPOINT') != null) {
        environment 'WOTCTL_SMOKE_ENDPOINT', System.getenv('WOTCTL_SMOKE_ENDPOINT')
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// wotctl-<version>-<os>-<arch>.tar.gz with the binary and the completion script
tasks.register('nativeDist', Tar) {
    description = 'Packages the native binary and the completion script.'
    group = 'distribution'
    def os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    def osName = os.contains('linux') ? 'linux' : (os.contains('mac') ? 'macos' : (os.contains('win') ? 'windows' : os))
    def arch = System.getProperty('os.arch')
    def archName = arch in ['amd64', 'x86_64'] ? 'x86_64' : (arch in ['aarch64', 'arm64'] ? 'aarch64' : arch)
    archiveFileName = "${cliName}-${project.version}-${osName}-${archName}.tar.gz"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    compression = Compression.GZIP
    into("${cliName}-${project.version}") {
        from(tasks.named('nativeCompile')) {
            include cliName
            include "${cliName}.exe"
            into 'bin'
            filePermissions { unix('rwxr-xr-x') }
        }
        from(completionScript) {
            into 'completion'
        }
        from('LICENSE')
    }
}

javadoc {
    destinationDir = file("${project.buildDir}/docs/javadoc/${project.name}/")
    failOnError = false
}
