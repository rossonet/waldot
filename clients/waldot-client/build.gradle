plugins {
    id "org.jreleaser"
    id "com.gorylenko.gradle-git-properties" version "2.5.7"
}

description = "WaldOT client API"
group = 'net.rossonet.waldot'
version = "${rootProject.version}"

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

apply plugin: 'java'
apply plugin: 'java-library'
apply plugin: 'java-test-fixtures'
apply plugin: 'eclipse'
apply plugin: "com.gorylenko.gradle-git-properties"
apply plugin: 'jacoco'
apply plugin: 'distribution'
apply plugin: 'signing'
apply plugin: 'maven-publish'
// org.jreleaser applied via plugins DSL above

dependencies {
    api project(':waldot-api')
    implementation project(':waldot-deps')
    // OPCUA CLIENT
    api group: 'org.eclipse.milo', name: 'milo-sdk-client', version: '1.1.0'
    testImplementation group: 'com.google.inject', name: 'guice', version: '7.0.0'
    testImplementation(platform('org.junit:junit-bom:5.13.1'))
	testImplementation('org.junit.jupiter:junit-jupiter')
	testRuntimeOnly('org.junit.platform:junit-platform-launcher')
    // shared test support (WaldotTestEnvironment, Testcontainers extensions)
    testFixturesImplementation project(':waldot-deps')
    testFixturesApi(platform('org.junit:junit-bom:5.13.1'))
    testFixturesApi('org.junit.jupiter:junit-jupiter-api')
    testFixturesApi('org.junit.platform:junit-platform-launcher')
    testFixturesApi('org.testcontainers:testcontainers:2.0.3')
}

// the test fixtures are used only by the tests of the other modules: they are
// not published with the client artifact
components.java.withVariantsFromConfiguration(configurations.testFixturesApiElements) { skip() }
components.java.withVariantsFromConfiguration(configurations.testFixturesRuntimeElements) { skip() }

task eclipseClosedDependencies {}

task eclipseClosedDependencies_ {}

compileJava {
    options.encoding = "UTF-8"
    options.compilerArgs.addAll(['-XprintProcessorInfo'])
}

eclipse {
    classpath {
        downloadJavadoc = true
        downloadSources = true
    }
}

task view { doLast { println "Working on project ${project.name} [ ${project.description} ]" } }

jar {
    enabled = true
}

jar.doLast { task ->
    // archivePath deprecated/removed; use archiveFile
    ant.checksum file: task.archiveFile.get().asFile
}

java {
    withJavadocJar()
    withSourcesJar()
}

gitProperties {
    failOnNoGitDirectory = false
    dateFormat = "yyyy-MM-dd HH:mm:ssZ"
    dateFormatTimeZone = 'GMT'
}

test {
    useJUnitPlatform()
}

javadoc{
    destinationDir = file("${project.buildDir}/docs/javadoc/${project.name}/")
    failOnError=false
}

publishing {
  publications {
    mavenJava(MavenPublication){
      artifactId = "${project.name}"
      from components.java
      versionMapping {
        usage('java-api') {
          fromResolutionOf('runtimeClasspath')
        }
        usage('java-runtime') {
          fromResolutionResult()
        }
      }
      pom {
        name = "${project.name}"
        description = "${project.description}"
        url = 'https://www.rossonet.net/'
        licenses {
          license {
            name = 'Apache-2.0 license'
            url = 'https://www.apache.org/licenses/LICENSE-2.0'
          }
        }
        developers {
          developer {
            id = 'ar4k'
            name = 'Andrea Ambrosini'
            email = 'andrea.ambrosini@rossonet.com'
          }
        }
        scm {
          connection = 'scm:git:git://github.com/rossonet/waldot.git'
          developerConnection = 'scm:git:ssh://github.com:rossonet/waldot.git'
          url = 'https://github.com/rossonet/waldot/tree/master'
        }
      }
    }    
  }
  repositories {
    maven {
      name = 'staging'
      url  = layout.buildDirectory.dir('staging-deploy')
    }
  }
}

if (plugins.hasPlugin('org.jreleaser')) {
  jreleaser {
    signing {
      mode = 'MEMORY'
      active = 'ALWAYS'
      armored = true
      secretKey = System.getenv('GPG_PRIVATE')
      publicKey = System.getenv('GPG_PUBLIC')
    }
    deploy {
      maven {
        mavenCentral {
          sonatype {
            active = 'ALWAYS'
            url = 'https://central.sonatype.com/api/v1/publisher'
            stagingRepository(
                layout.buildDirectory
                       .dir('staging-deploy')
                       .get()
                       .asFile
                       .absolutePath
            )
            username = System.getenv('OSSRH_USERNAME')
            password = System.getenv('OSSRH_PASSWORD') 
          }
        }
      }
    }
  }
}

if (plugins.hasPlugin('org.jreleaser')) {
  tasks.named('publish').configure { dependsOn 'jreleaserDeploy' }
  tasks.named('jreleaserDeploy').configure { dependsOn 'publishAllPublicationsToStagingRepository' }
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}
